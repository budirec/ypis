version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: tempeh_postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tempeh_erp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tempeh_net

  redis:
    image: redis:7-alpine
    container_name: tempeh_redis
    volumes:
      - redis_data:/data
    networks:
      - tempeh_net

  backend:
    image: node:20-alpine
    container_name: tempeh_backend
    working_dir: /app
    volumes:
      - ./backend:/app
    command: /bin/sh -c "npm install && npm run start:dev"
    networks:
      - tempeh_net
    depends_on:
      - postgres
      - redis

  frontend:
    image: node:20-alpine
    container_name: tempeh_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: /bin/sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    networks:
      - tempeh_net

volumes:
  postgres_data:
  redis_data:

networks:
  tempeh_net:
    driver: bridge
